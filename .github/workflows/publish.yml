name: Publish Elixir Chronicle Client

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  pull_request:
    types: [closed]
    branches:
      - "**"
    paths:
      - "Source/**"

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            Source/chronicle/deps
            Source/chronicle/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('Source/chronicle/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        working-directory: ./Source/chronicle
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: ./Source/chronicle
        run: mix deps.get

      - name: Compile
        working-directory: ./Source/chronicle
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: ./Source/chronicle
        run: mix test

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: [release, test]
    if: needs.release.outputs.publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            Source/chronicle/deps
            Source/chronicle/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('Source/chronicle/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        working-directory: ./Source/chronicle
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: ./Source/chronicle
        run: mix deps.get

      - name: Copy README for Hex package
        run: cp README.md Source/chronicle/README.md

      - name: Publish to Hex
        working-directory: ./Source/chronicle
        run: mix hex.publish --yes
        env:
          CHRONICLE_VERSION: ${{ needs.release.outputs.version }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
